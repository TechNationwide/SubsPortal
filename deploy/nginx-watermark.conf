upstream vateam_api {
    server 127.0.0.1:8006;
    keepalive 16;
}

upstream vateam_web {
    server 127.0.0.1:3011;
    keepalive 16;
}

server {
    server_name internalportal.nationwideadvance.com;

    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location /api/ {
        proxy_pass http://vateam_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass http://vateam_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://vateam_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/internalportal.nationwideadvance.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/internalportal.nationwideadvance.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80;
    listen [::]:80;
    server_name watermark.solutions90.com;
    return 301 https://internalportal.nationwideadvance.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name watermark.solutions90.com;

    ssl_certificate /etc/letsencrypt/live/watermark.solutions90.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watermark.solutions90.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://internalportal.nationwideadvance.com$request_uri;
}


server {
    if ($host = internalportal.nationwideadvance.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name internalportal.nationwideadvance.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}